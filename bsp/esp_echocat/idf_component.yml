
version: "1.1.0"
description: Board Support Package (BSP) for ESP-EchoCat
url: https://github.com/KhuongTH1/esp-bsp/tree/master/bsp/esp_echocat

targets:
  - esp32s3

tags:
  - bsp

dependencies:
  idf: ">=5.5"

  esp_codec_dev:
    version: "~1.5"
    public:  true

  espressif/esp_lvgl_port:
    version: "^2"
    public:  true

  espressif/esp_lcd_st77916:
    version: "*"
    public:  false

  espressif/esp_lcd_touch_cst816s:
    version: "*"
    public:  false

  button:
    version: "^4"
    public:  true

  led_indicator:
    version: "^2"
    public:  true

examples:
- path: ../../examples/display
- path: ../../examples/display_rotation
- path: ../../examples/display_audio_photo
- path: ../../examples/display_lvgl_demos
- path: ../../examples/display_sdcard
